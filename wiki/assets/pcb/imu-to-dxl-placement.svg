<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img" aria-label="imu_to_dxl PCB placement reference">
  <defs>
    <style>
      .title { font: 700 14px 'Segoe UI', sans-serif; fill: #1a2332; }
      .sub { font: 11px 'Segoe UI', sans-serif; fill: #5a6578; }
      .lbl { font: 600 10px 'Segoe UI', sans-serif; fill: #1a2332; }
      .tiny { font: 9px 'Segoe UI', sans-serif; fill: #5a6578; }
      .note { font: 10px 'Segoe UI', sans-serif; fill: #3d4a5c; }
      .board { fill: #e8f0e4; stroke: #2f5d3a; stroke-width: 2; }
      .conn { fill: #d4e4f7; stroke: #2a5a8a; stroke-width: 1.5; }
      .imu { fill: #e8f4ff; stroke: #1e5a8a; stroke-width: 1.5; }
      .mcu { fill: #fff6e0; stroke: #8a5a10; stroke-width: 1.5; }
      .ldo { fill: #f0e8ff; stroke: #5a3a8a; stroke-width: 1.2; }
      .buf { fill: #ffe8e8; stroke: #8a3030; stroke-width: 1.2; }
      .pass { fill: #f0f0f0; stroke: #666; stroke-width: 1; }
      .dnp { fill: #fafafa; stroke: #999; stroke-width: 1; stroke-dasharray: 3 2; }
      .zone { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 5 4; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.2; marker-end: url(#ah); }
    </style>
    <marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="520" height="360" fill="#f7f8fa"/>
  <text class="title" x="16" y="24">imu_to_dxl PCB placement (top view, REFERENCE)</text>
  <text class="sub" x="16" y="42">Board outline ~22 x 16 mm (placeholder) · SPI shortest · DXL entry on left</text>
  <rect class="board" x="40" y="60" width="400" height="250" rx="4"/>
  <text class="tiny" x="48" y="76">TOP · component side</text>
  <text class="tiny" x="320" y="76">~22 mm</text>
  <text class="tiny" x="48" y="300" transform="rotate(-90 48 300)">~16 mm</text>
  <rect class="zone" x="52" y="88" width="100" height="200" rx="2"/>
  <text class="tiny" x="58" y="102">Power / Bus</text>
  <rect class="zone" x="168" y="88" width="175" height="200" rx="2"/>
  <text class="tiny" x="174" y="102">MCU + IMU</text>
  <rect class="zone" x="358" y="88" width="70" height="200" rx="2"/>
  <text class="tiny" x="364" y="102">Debug</text>
