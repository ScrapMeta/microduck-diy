  <text class="tiny" x="376" y="210">DIO</text>
  <text class="tiny" x="376" y="220">CLK</text>
  <text class="tiny" x="376" y="230">GND</text>
  <text class="note" x="40" y="330">J1 cable out · U1 next to U2 (SPI short) · D1/U6 by DATA · Y1/C7/C8 DNP · solid GND plane</text>
  <text class="sub" x="40" y="348">NOT OFFICIAL · wiki: imu-to-dxl-ref-pcb-layout</text>
</svg>
