  <text class="lbl" x="192" y="190">U2</text>
  <text class="tiny" x="188" y="204">STM32G031</text>
  <text class="tiny" x="188" y="216">TSSOP-20</text>
  <rect class="pass" x="180" y="128" width="18" height="12" rx="1"/>
  <text class="tiny" x="181" y="137">C3</text>
  <rect class="pass" x="204" y="128" width="18" height="12" rx="1"/>
  <text class="tiny" x="205" y="137">R1</text>
  <text class="tiny" x="200" y="120">NRST</text>
  <rect class="dnp" x="180" y="250" width="48" height="24" rx="2"/>
  <text class="lbl" x="188" y="265">Y1</text>
  <text class="tiny" x="186" y="276">DNP 32k</text>
  <rect class="dnp" x="232" y="250" width="14" height="10" rx="1"/>
  <text class="tiny" x="233" y="258">C7</text>
  <rect class="dnp" x="232" y="264" width="14" height="10" rx="1"/>
  <text class="tiny" x="233" y="272">C8</text>
  <rect class="imu" x="270" y="165" width="55" height="55" rx="3"/>
  <text class="lbl" x="280" y="190">U1</text>
  <text class="tiny" x="276" y="204">LSM6DSV</text>
  <text class="tiny" x="278" y="216">SPI short</text>
  <rect class="pass" x="290" y="148" width="18" height="12" rx="1"/>
  <text class="tiny" x="291" y="157">C1</text>
  <path class="arrow" d="M252 195 L268 195"/>
  <text class="tiny" x="248" y="188">SPI</text>
  <path class="arrow" d="M64 185 L108 140"/>
  <text class="tiny" x="70" y="140">DATA</text>
  <rect class="conn" x="372" y="150" width="44" height="70" rx="2"/>
  <text class="lbl" x="382" y="175">J2</text>
  <text class="tiny" x="376" y="188">SWD</text>
