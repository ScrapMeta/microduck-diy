name: ci

# 规则是 AGENTS.md，机械校验是那两台脚本 + 自检 —— 它们抓的是「页面改名了但别处还写着老路径」这类漂移。
# 改脚本参数等于改规格，见 AGENTS.md「改规则 / 技能 / wiki」。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: wiki 规范（frontmatter · 行数 · 死链）
        run: python scripts/wiki_lint.py

      - name: 仓内引用（反引号 / 链接路径）
        run: python scripts/refs_lint.py

      # 校验器自己也要被校验：种下已知故障，断言真的报错。
      # 缺了这一步，一台「永远 exit 0」的 linter 看起来和正常的一模一样。
      - name: linter 自检（注入故障 → 必须报错）
        run: python scripts/lint_selftest.py

      - name: 脚本语法自检
        run: python -m compileall -q scripts/*.py
